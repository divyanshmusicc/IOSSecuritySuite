name: Build unsigned IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: List schemes
        run: xcodebuild -list -project IOSSecuritySuite.xcodeproj
      - name: Build app without signing
        run: |
          xcodebuild -project IOSSecuritySuite.xcodeproj \
            -scheme FrameworkClientApp \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build
      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -r ISS-demo-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ISS-demo-ipa
          path: ISS-demo-unsigned.ipa
